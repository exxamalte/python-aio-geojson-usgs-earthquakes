name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  # Required for OIDC / Trusted Publishing
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Required for PyPI Trusted Publishing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Generate PEP 740 attestations
        uses: pypa/attestations@v1
        with:
          packages-dir: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.9.0
        with:
          attestations: true
